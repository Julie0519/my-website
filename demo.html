<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="可复用音乐可视化 Web Component 演示">
  <title>Music Visualizer Plugin Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #030305;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 5%, rgba(139, 92, 246, 0.13), transparent 25%),
        #030305;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 54px 0 72px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 0.98;
      letter-spacing: -0.05em;
      font-weight: 600;
    }

    p {
      max-width: 650px;
      margin: 18px 0 0;
      color: rgba(255, 255, 255, 0.62);
      line-height: 1.7;
    }

    .badge {
      align-self: start;
      padding: 10px 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
    }

    .embed-note {
      margin-top: 22px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.035);
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.65;
      font-size: 14px;
    }

    code {
      color: #c4b5fd;
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 30px;
      }

      header {
        grid-template-columns: 1fr;
      }

      .badge {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Music<br>Visualizer</h1>
        <p>
          一个不依赖框架的音乐交互插件。上传音乐或启用麦克风后，
          低频、中频、高频和总体音量会分别控制球体、城市和波形动画。
        </p>
      </div>
      <div class="badge">Native Web Component</div>
    </header>

    <music-visualizer
      mode="sphere"
      accent="#8b5cf6"
      background="#050507">
    </music-visualizer>

    <div class="embed-note">
      嵌入其他网页时，只需要引入
      <code>music-visualizer.js</code>，然后写入
      <code>&lt;music-visualizer&gt;&lt;/music-visualizer&gt;</code>。
      麦克风功能需要在 HTTPS 或 localhost 环境中运行。
    </div>
  </main>

  <script src="./music-visualizer.js"></script>
</body>
</html>
